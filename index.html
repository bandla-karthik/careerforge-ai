                                            <h2 className="text-sm sm:text-base font-bold text-slate-900">CareerForge AI Interview</h2>
                                            <span className="flex items-center gap-1.5 text-xs font-semibold text-emerald-700 bg-emerald-50 border border-emerald-200 rounded-full px-2 py-0.5">
                                                <span className="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>Live
                                            </span>
                                        </div>
                                        <div className="flex flex-wrap items-center gap-x-4 gap-y-1 text-xs text-slate-500">
                                            <span className="font-medium text-slate-700">Question {questions.length ? currentQuestionIndex + 1 : 0} of {questions.length}</span>
                                            <span className="font-mono"><i className="far fa-clock mr-1"></i>{fmtDuration(interviewSeconds)}</span>
                                            <span className={isOnline ? 'text-emerald-600' : 'text-red-600'}>
                                                <i className={`fas fa-signal mr-1`}></i>{isOnline ? 'Connected' : 'Offline'}
                                            </span>
                                            <button onClick={() => setActiveTab('report')} className="px-3 py-1.5 rounded-lg bg-red-600 hover:bg-red-700 text-white font-semibold transition">
                                                End Interview
                                            </button>
                                        </div>
                                    </div>

                                    {/* Video stage */}
                                    <div className="iv-stage relative w-full rounded-2xl overflow-hidden border border-slate-200 shadow-md" style={{ aspectRatio: '16 / 9', minHeight: 240 }}>
                                        <svg viewBox="0 0 640 360" preserveAspectRatio="xMidYMax slice" className="absolute inset-0 w-full h-full" role="img" aria-label="AI interviewer">
                                            <defs>
                                                <linearGradient id="ivWall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor="#dfe5f3"/><stop offset="1" stopColor="#efe9e1"/></linearGradient>
                                                <linearGradient id="ivBlazer" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stopColor="#2b3a55"/><stop offset="1" stopColor="#1b2740"/></linearGradient>
                                            </defs>
                                            <rect width="640" height="360" fill="url(#ivWall)"/>
                                            <rect x="470" y="40" width="130" height="150" rx="6" fill="#ffffff" opacity=".55"/>
                                            <rect x="40" y="70" width="90" height="110" rx="4" fill="#cfd7ea" opacity=".6"/>
                                            <g className="iv-breathe">
                                                <path d="M130 360 C130 298 200 272 320 272 C440 272 510 298 510 360 Z" fill="url(#ivBlazer)"/>
                                                <path d="M282 274 L320 336 L358 274 Z" fill="#f8fafc"/>
                                                <path d="M282 274 L320 336 L296 360 L250 360 Z" fill="#162034"/>
                                                <path d="M358 274 L320 336 L344 360 L390 360 Z" fill="#162034"/>
                                                <rect x="298" y="232" width="44" height="50" rx="16" fill="#cf9779"/>
                                                <g className={ivAiState === 'listening' ? 'iv-nod' : ''}>
                                                    <ellipse cx="262" cy="186" rx="7" ry="14" fill="#d9a382"/>
                                                    <ellipse cx="378" cy="186" rx="7" ry="14" fill="#d9a382"/>
                                                    <ellipse cx="320" cy="180" rx="58" ry="70" fill="#e4b192"/>
                                                    <path d="M256 176 C246 104 298 90 322 90 C374 90 396 128 384 178 C374 150 354 132 322 132 C292 132 268 148 256 176 Z" fill="#2a2220"/>
                                                    <g className="iv-blink"><ellipse cx="298" cy="182" rx="6" ry="4" fill="#2a2220"/></g>
                                                    <g className="iv-blink"><ellipse cx="342" cy="182" rx="6" ry="4" fill="#2a2220"/></g>
                                                    <path d="M287 168 Q298 162 309 167" stroke="#2a2220" strokeWidth="3" fill="none" strokeLinecap="round"/>
                                                    <path d="M331 167 Q342 162 353 168" stroke="#2a2220" strokeWidth="3" fill="none" strokeLinecap="round"/>
                                                    <path d="M320 188 Q314 208 322 212" stroke="#c48b6d" strokeWidth="2.5" fill="none" strokeLinecap="round"/>
                                                    {ivAiState === 'speaking'
                                                        ? <ellipse className="iv-talk" cx="320" cy="226" rx="12" ry="3" fill="#8f3f3a"/>
                                                        : <path d="M306 224 Q320 234 334 224" stroke="#9a4a44" strokeWidth="3" fill="none" strokeLinecap="round"/>}
                                                </g>
                                            </g>
                                        </svg>

                                        {/* Interviewer name tag + state */}
                                        <div className="absolute top-3 left-3 flex items-center gap-2 bg-white/90 rounded-full pl-2 pr-3 py-1 shadow-sm border border-slate-200">
                                            <span className={`w-2 h-2 rounded-full ${stateColor} ${ivAiState !== 'ready' ? 'iv-ring' : ''}`}></span>
                                            <span className="text-[10px] font-bold text-slate-700 tracking-wide">{stateLabel}</span>
                                            {ivAiState === 'thinking' && <span className="flex gap-0.5"><i className="iv-dot w-1 h-1 rounded-full bg-slate-500 inline-block"></i><i className="iv-dot w-1 h-1 rounded-full bg-slate-500 inline-block"></i><i className="iv-dot w-1 h-1 rounded-full bg-slate-500 inline-block"></i></span>}
                                        </div>
                                        <div className="absolute bottom-3 left-3 bg-slate-900/70 text-white text-[11px] px-2.5 py-1 rounded-md max-w-[55%] truncate">
                                            AI Interviewer · {stateText}
                                        </div>
                                        {isRecording && (
                                            <div className="absolute top-3 right-3 bg-red-600 text-white text-[10px] font-bold px-2.5 py-1 rounded-full flex items-center gap-1 shadow-sm">
                                                <span className="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span>
                                                <span>Your answer is being recorded · {recordingTimer}s</span>
                                            </div>
                                        )}

                                        {/* Candidate picture-in-picture */}
                                        <div className="absolute bottom-3 right-3 w-28 sm:w-40 md:w-52 rounded-xl overflow-hidden border-2 border-white shadow-lg bg-slate-800" style={{ aspectRatio: '4 / 3' }}>
                                            {cameraEnabled ? (
                                                <video ref={videoRef} autoPlay playsInline muted className="w-full h-full object-cover" style={{ transform: 'scaleX(-1)' }}></video>
                                            ) : (
                                                <div className="w-full h-full flex flex-col items-center justify-center bg-gradient-to-br from-slate-700 to-slate-800 text-slate-300">
                                                    <div className="w-9 h-9 sm:w-12 sm:h-12 rounded-full bg-slate-600 flex items-center justify-center text-sm sm:text-lg font-semibold text-white">
                                                        {(candidateName || 'You').trim().charAt(0).toUpperCase()}
                                                    </div>
                                                    <div className="text-[9px] sm:text-[10px] mt-1">Camera is off</div>
                                                </div>
                                            )}
                                            <div className="absolute bottom-1 left-1 text-[9px] bg-slate-900/70 text-white px-1.5 py-0.5 rounded">{candidateName || 'You'}</div>
                                        </div>
                                    </div>

                                    {/* Question */}
                                    <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-4 sm:p-5">
                                        <div className="flex items-center justify-between gap-2 mb-1.5">
                                            <div className="text-[11px] font-semibold text-indigo-600 uppercase tracking-wider">
                                                AI Interviewer · {q?.type || 'Technical'} Round
                                            </div>
                                            {q?.isAdaptive && <span className="text-[10px] px-2 py-0.5 rounded bg-amber-100 text-amber-800 border border-amber-200 font-bold">FOLLOW-UP</span>}
                                        </div>
                                        <p className="text-base sm:text-lg font-semibold text-slate-900 leading-relaxed">
                                            {q ? `"${q.question}"` : 'Run the analysis first and I\'ll prepare your interview questions.'}
                                        </p>
                                    </div>

                                    {/* Call toolbar */}
                                    <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-3 flex flex-wrap items-center justify-between gap-3 relative">
                                        <div className="flex items-center gap-2">
                                            {callBtn(isRecording ? 'fa-microphone' : 'fa-microphone-slash', 'Mic', isRecording, isRecording ? stopSpeechRecognition : startSpeechRecognition)}
                                            {callBtn(cameraEnabled ? 'fa-video' : 'fa-video-slash', 'Camera', cameraEnabled, toggleCamera)}
                                            {callBtn(speakerOn ? 'fa-volume-high' : 'fa-volume-xmark', 'Speaker', speakerOn, () => { setSpeakerOn(v => !v); })}
                                            {callBtn('fa-comment-dots', 'Transcript', showTranscriptPanel, () => setShowTranscriptPanel(v => !v))}
                                            {callBtn('fa-gear', 'Settings', showSettings, () => setShowSettings(v => !v))}
                                        </div>

                                        <div className="flex items-center gap-2 flex-1 sm:flex-none justify-end">
                                            {!isRecording ? (
                                                <button onClick={startSpeechRecognition} disabled={!q} className="flex-1 sm:flex-none px-5 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm shadow-md transition disabled:opacity-50 flex items-center justify-center gap-2">
                                                    <i className="fas fa-microphone"></i><span>START ANSWERING</span>
                                                </button>
                                            ) : (
                                                <button onClick={stopSpeechRecognition} className="flex-1 sm:flex-none px-5 py-3 rounded-xl bg-red-600 hover:bg-red-700 text-white font-bold text-sm shadow-md transition flex items-center justify-center gap-2">
                                                    <i className="fas fa-stop"></i><span>STOP ANSWER</span>
                                                </button>
                                            )}
                                            <button
                                                onClick={() => handleSubmitAnswer()}
                                                disabled={isEvaluating || !q || isRecording}
                                                className="px-4 py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-sm transition disabled:opacity-50"
                                                title={isRecording ? 'Stop the recording before submitting' : 'Submit your captured answer'}
                                            >
                                                {isEvaluating ? 'Evaluating…' : 'Submit Answer'}
                                            </button>
                                            <button onClick={() => setCurrentQuestionIndex(i => Math.min(questions.length - 1, i + 1))} disabled={isRecording || isEvaluating || currentQuestionIndex >= questions.length - 1} className="px-3 py-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-medium transition disabled:opacity-40" title="Ready for the next question?">
                                                Next <i className="fas fa-arrow-right text-xs ml-1"></i>
                                            </button>
                                        </div>

                                        {showSettings && (
                                            <div className="absolute bottom-full left-3 mb-2 w-64 bg-white rounded-xl border border-slate-200 shadow-lg p-3 text-xs space-y-2 z-20">
                                                <label className="flex items-center justify-between cursor-pointer">
                                                    <span className="text-slate-700">Type my answers instead</span>
                                                    <input type="checkbox" checked={textResponseMode} onChange={(e) => setTextResponseMode(e.target.checked)} />
                                                </label>
                                                <label className="flex items-center justify-between cursor-pointer">
                                                    <span className="text-slate-700">Read questions aloud</span>
                                                    <input type="checkbox" checked={speakerOn} onChange={(e) => setSpeakerOn(e.target.checked)} />
                                                </label>
                                                <button onClick={() => setShowAddQuestionsModal(true)} className="w-full text-left text-blue-700 font-medium hover:underline">+ Request more questions</button>
                                            </div>
                                        )}
                                    </div>

                                    {/* Answer capture area */}
                                    {noSpeechError && (
                                        <div className="p-3 bg-amber-50 text-amber-800 rounded-xl text-xs border border-amber-200">
                                            <div className="font-semibold">No response detected.</div>
                                            <div className="text-[11px] text-amber-700 mt-0.5">
                                                Allow microphone access in Chrome/Edge, then try again. You can also switch to typing in Settings.
                                            </div>
                                        </div>
                                    )}

                                    {isRecording && (
                                        <div className="rounded-2xl border-2 border-red-200 bg-slate-950 text-white shadow-lg overflow-hidden">
                                            <div className="px-4 py-3 flex items-center justify-between border-b border-white/10">
                                                <div className="flex items-center gap-2">
                                                    <span className="w-3 h-3 rounded-full bg-red-500 animate-pulse"></span>
                                                    <span className="text-xs font-extrabold tracking-wider text-red-300">LIVE CAPTION — YOUR ANSWER</span>
                                                </div>
                                                <span className="font-mono text-xs text-slate-300">{fmtDuration(recordingTimer)}</span>
                                            </div>
                                            <div className="p-5 min-h-[130px] max-h-[260px] overflow-y-auto">
                                                <p className="text-base sm:text-lg leading-relaxed font-medium">
                                                    {transcript
                                                        ? transcript
                                                        : <span className="text-slate-500">Start speaking — your answer will appear here live...</span>}
                                                </p>
                                            </div>
                                            <div className="px-4 py-2 bg-white/5 text-[10px] text-slate-400 flex items-center gap-2">
                                                <i className="fas fa-circle text-red-400 text-[6px]"></i>
                                                <span>Listening continuously — pauses will not end your answer.</span>
                                            </div>
                                        </div>
                                    )}

                                    {!isRecording && transcript && (
                                        <div className="rounded-2xl border border-emerald-200 bg-emerald-50 shadow-sm overflow-hidden">
                                            <div className="px-4 py-3 flex items-center justify-between border-b border-emerald-200">
                                                <div className="flex items-center gap-2">
                                                    <i className="fas fa-check-circle text-emerald-600"></i>
                                                    <span className="text-[10px] font-extrabold tracking-wider text-emerald-800 uppercase">Captured Answer</span>
                                                </div>
                                                <span className="text-[10px] text-emerald-700">Review before submitting</span>
                                            </div>
                                            <div className="p-4">
                                                <p className="text-sm sm:text-base text-slate-800 leading-relaxed">{transcript}</p>
                                            </div>
                                        </div>
                                    )}

                                    {textResponseMode && (
                                        <div className="bg-white rounded-2xl border border-slate-200 p-4 space-y-3 shadow-sm">
                                            <div className="flex items-center justify-between">
                                                <div>
                                                    <div className="text-xs font-bold text-slate-700 uppercase tracking-wider">Type Your Answer</div>
                                                    <div className="text-[10px] text-slate-400 mt-0.5">Your typed response will be submitted directly.</div>
                                                </div>
                                                <button onClick={() => setTextResponseMode(false)} className="text-xs text-slate-500 hover:text-slate-800 underline">
                                                    Switch to voice
                                                </button>
                                            </div>
                                            <textarea
                                                rows={6}
                                                value={manualResponseText}
                                                onChange={(e) => setManualResponseText(e.target.value)}
                                                placeholder="Type your response to the interview question..."
                                                className="w-full text-sm p-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:border-blue-400 text-slate-800 resize-y"
                                            />
                                            <button
                                                onClick={() => handleSubmitAnswer(manualResponseText)}
                                                disabled={isEvaluating || !q || !manualResponseText.trim()}
                                                className="px-4 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-sm transition disabled:opacity-50"
                                            >
                                                {isEvaluating ? 'Evaluating…' : 'Submit Typed Answer'}
                                            </button>
                                        </div>
                                    )}

                                    {showTranscriptPanel && !isRecording && !transcript && (
                                        <div className="bg-white rounded-2xl border border-slate-200 p-4">
                                            <div className="text-[10px] font-bold text-slate-500 uppercase mb-1">Live Transcript</div>
                                            <p className="text-sm text-slate-500">Your words will appear here as you speak.</p>
                                        </div>
                                    )}

                                    {/* Question queue */}
                                    <div className="bg-white p-3 rounded-2xl border border-slate-200 flex items-center gap-2 overflow-x-auto text-xs">
                                        <span className="font-semibold text-slate-600 shrink-0 mr-2">Questions</span>
                                        {questions.map((qq, idx) => (
                                            <button key={qq.id} onClick={() => setCurrentQuestionIndex(idx)}
                                                className={`w-7 h-7 shrink-0 rounded-full font-medium flex items-center justify-center transition ${
                                                    idx === currentQuestionIndex ? 'bg-indigo-600 text-white ring-2 ring-indigo-200'
                                                    : evaluations[qq.id] ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>
                                                {idx + 1}
                                            </button>
                                        ))}
                                        <button onClick={() => setShowAddQuestionsModal(true)} className="ml-auto shrink-0 px-3 py-1.5 bg-blue-50 text-blue-700 border border-blue-200 rounded-lg font-semibold hover:bg-blue-100 transition">
                                            <i className="fas fa-plus text-[10px] mr-1"></i>Request More Questions
                                        </button>
                                    </div>

                                    {/* Feedback (unchanged data from existing evaluations state) */}
                                    {ev && (
                                        <div className="p-5 bg-white rounded-2xl border border-slate-200 shadow-sm space-y-4">
                                            <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                                                <h3 className="font-bold text-slate-900 text-sm">How You Performed</h3>
                                                <span className="text-xs font-bold px-2.5 py-1 bg-indigo-50 text-indigo-700 rounded-full border border-indigo-200">Overall Score: {ev.overallScore}%</span>
                                            </div>
                                            <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 text-center">
                                                {[['Technical', ev.technicalAccuracy], ['Relevance', ev.relevance], ['Completeness', ev.completeness], ['Communication', ev.communication]].map(([l, v]) => (
                                                    <div key={l} className="p-2.5 bg-slate-50 rounded-lg border border-slate-100">
                                                        <div className="text-[10px] text-slate-500 uppercase font-semibold">{l}</div>
                                                        <div className="text-base font-bold text-slate-800 mt-0.5">{v}%</div>
                                                    </div>
                                                ))}
                                            </div>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
                                                <div className="p-3 bg-emerald-50/50 rounded-lg border border-emerald-100 text-emerald-900"><strong>Strengths:</strong> {ev.strengths}</div>
                                                <div className="p-3 bg-amber-50/50 rounded-lg border border-amber-100 text-amber-900"><strong>Strengthening Area:</strong> {ev.areasForImprovement}</div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                                );
                            })()}

                            {/* TAB 7: 3D CAREER DIGITAL TWIN */}
                            {activeTab === 'twin' && (
                                <div className="space-y-6">
                                    <div>
                                        <h2 className="text-xl font-bold text-slate-900">3D Career Digital Twin</h2>
                                        <p className="text-sm text-slate-500">Visual mapping connecting candidate proficiency to target role competencies.</p>
                                    </div>

                                    <DigitalTwinCanvas />
                                </div>
                            )}

                            {/* TAB 8: CAREER INTELLIGENCE REPORT */}
                            {activeTab === 'report' && (
                                <div className="space-y-6">
                                    <div className="flex justify-between items-center">
                                        <div>
                                            <h2 className="text-xl font-bold text-slate-900">Career Intelligence Report</h2>
                                            <p className="text-sm text-slate-500">Comprehensive session report calculated from actual candidate interaction data.</p>
                                        </div>
                                        <button
                                            onClick={() => window.print()}
                                            className="text-xs px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-lg border border-slate-200 transition"
                                        >
                                            <i className="fas fa-print mr-1"></i> Print Report
                                        </button>
                                    </div>

                                    <div className="bg-white p-8 rounded-xl border border-slate-200 space-y-6">
                                        <div className="border-b border-slate-200 pb-4 flex justify-between items-start">
                                            <div>
                                                <h3 className="text-lg font-bold text-slate-900">{candidateName || 'Candidate Profile'}</h3>
                                                <p className="text-xs text-slate-500">Target Role: {targetRole || 'Not specified'}</p>
                                            </div>
                                            <div className="text-right text-xs text-slate-400">
                                                <div>Date: {new Date().toLocaleDateString()}</div>
                                                <div>Engine: Local Analysis</div>
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-3 gap-4 text-center">
                                            <div className="p-4 bg-slate-50 rounded-xl border border-slate-100">
                                                <div className="text-xs text-slate-500 font-medium">Overall Match</div>
                                                <div className="text-xl font-bold text-slate-900 mt-1">{matchScore > 0 ? `${matchScore}%` : '--'}</div>
                                            </div>
                                            <div className="p-4 bg-slate-50 rounded-xl border border-slate-100">
                                                <div className="text-xs text-slate-500 font-medium">Skill Coverage</div>
                                                <div className="text-xl font-bold text-slate-900 mt-1">{skillCoverage > 0 ? `${skillCoverage}%` : '--'}</div>
                                            </div>
                                            <div className="p-4 bg-slate-50 rounded-xl border border-slate-100">
                                                <div className="text-xs text-slate-500 font-medium">Avg. Interview Score</div>
                                                <div className="text-xl font-bold text-blue-600 mt-1">{avgInterviewScore !== '--' ? `${avgInterviewScore}%` : '--'}</div>
                                            </div>
                                        </div>

                                        <div className="space-y-3 text-xs">
                                            <h4 className="font-bold text-slate-900 text-sm">Strategic Recommendations</h4>
                                            <ul className="list-disc pl-5 text-slate-700 space-y-1">
                                                {missingSkills.length > 0 ? (
                                                    missingSkills.map((sk, idx) => (
                                                        <li key={idx}>Focus learning project work on <strong>{sk}</strong> to boost target job requirement coverage.</li>
                                                    ))
                                                ) : (
                                                    <li>All primary job skills are accounted for in candidate profile.</li>
                                                )}
                                                <li>Incorporate metrics and quantified business impact into experience bullet points.</li>
                                            </ul>
                                        </div>
                                    </div>
                                </div>
                            )}

                        </main>
                    </div>

                    {/* Request More Questions Modal */}
                    {showAddQuestionsModal && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-xl border border-slate-200 max-w-md w-full p-6 space-y-4 shadow-xl">
                                <div className="flex justify-between items-center">
                                    <h3 className="font-bold text-slate-900 text-base">Request More Questions</h3>
                                    <button onClick={() => setShowAddQuestionsModal(false)} className="text-slate-400 hover:text-slate-600 text-sm">
                                        <i className="fas fa-xmark"></i>
                                    </button>
                                </div>

                                <div className="space-y-3 text-xs">
                                    <p className="text-slate-600">Select how many dynamic interview questions you want to add to your queue:</p>

                                    <div className="grid grid-cols-3 gap-2">
                                        {[3, 5, 10].map(cnt => (
                                            <button
                                                key={cnt}
                                                onClick={() => handleAddQuestions(cnt, 'Technical')}
                                                className="py-2.5 bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold rounded-lg border border-blue-200 transition"
                                            >
                                                +{cnt} Questions
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        window.onload = function() {
            ReactDOM.render(<App />, document.getElementById('root'));
        };
    </script>
</body>
</html>
