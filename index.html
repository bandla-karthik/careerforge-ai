    <style>
        body {

        /* Custom scrollbar */

        .pulse-subtle {

        @keyframes pulse-border {
            0% { border-color: rgba(59, 130, 246, 0.3); }

        .wave-bar {

        /* ---- Interview Room redesign ---- */
        .iv-stage { background: linear-gradient(160deg, #e9edf7 0%, #f4efe8 100%); }
        @keyframes ivBreathe { 0%,100% { transform: translateY(0); } 50% { transform: translateY(2px); } }
        @keyframes ivBlink { 0%,92%,100% { transform: scaleY(1); } 96% { transform: scaleY(0.1); } }
        @keyframes ivTalk { 0%,100% { transform: scaleY(0.6); } 50% { transform: scaleY(2.6); } }
        @keyframes ivNod { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(1.2deg); } }
        @keyframes ivRing { 0% { box-shadow: 0 0 0 0 rgba(99,102,241,.25); } 100% { box-shadow: 0 0 0 14px rgba(99,102,241,0); } }
        @keyframes ivDot { 0%,80%,100% { opacity: .25; } 40% { opacity: 1; } }
        .iv-breathe { animation: ivBreathe 4.5s ease-in-out infinite; }
        .iv-blink { transform-box: fill-box; transform-origin: center; animation: ivBlink 5s infinite; }
        .iv-talk { transform-box: fill-box; transform-origin: center; animation: ivTalk .38s ease-in-out infinite; }
        .iv-nod { transform-origin: 320px 250px; animation: ivNod 3.2s ease-in-out infinite; }

        .iv-dot:nth-child(2) { animation-delay: .2s; } .iv-dot:nth-child(3) { animation-delay: .4s; }
        @media (prefers-reduced-motion: reduce) { .iv-breathe,.iv-blink,.iv-talk,.iv-nod,.iv-ring,.iv-dot { animation: none; } }

<body class="bg-slate-50 text-slate-900 antialiased min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // Sample Judge Mode Default Data
        const SAMPLE_CANDIDATE = {
            name: "Alex Morgan",
            email: "alex.morgan@university.edu",
            targetRole: "Junior Machine Learning Engineer",
            extractedSkills: ["Python", "SQL", "Machine Learning", "Pandas", "Scikit-Learn", "PyTorch", "FastAPI", "Data Analysis", "Git", "REST APIs"],
            requiredSkills: ["Python", "SQL", "Machine Learning", "PyTorch", "FastAPI", "Docker", "AWS", "MLOps", "CI/CD", "Kubernetes"],
            missingSkills: ["Docker", "AWS", "MLOps", "Kubernetes"],
            matchScore: 68,
            skillCoverage: 60,
            atsReadability: 92,
            resumeText: `ALEX MORGAN
Email: alex.morgan@university.edu | Phone: (555) 019-2834
Education: B.S. in Computer Science, State University (2024)

EXPERIENCE:
Machine Learning Research Assistant | AI Lab (2023 - Present)
• Developed and tuned Scikit-Learn and PyTorch models for classification tasks on tabular data, improving accuracy by 14%.
• Built dynamic web APIs using FastAPI and Python to serve ML prediction endpoints to over 2,000 active monthly users.
• Extracted, cleaned, and analyzed large datasets using Pandas, NumPy, and SQL queries.
• Conducted code reviews and maintained repository workflows using Git and GitHub.

PROJECTS:
Predictive Analytics Pipeline
• Designed a full-stack data ingestion script in Python and SQL to aggregate daily financial trends.
• Utilized Scikit-Learn for random forest regression modeling and dynamic data visualization.`,
            jobDescription: `Target Position: Senior Solution Architect
Department: AI Solutions & Cloud Infrastructure

Challenge Requirements:
- Looking for a 5-year senior architect who can own system architecture and technical design.
- This is also an entry-level opportunity for candidates who are willing to learn and grow.
- Strong proficiency in Python, SQL, and foundational Machine Learning models (Scikit-Learn, PyTorch).
- Hands-on experience developing web endpoints via FastAPI or Flask.
- Experience with Cloud deployment platforms (AWS, GCP, or Azure) and containerization using Docker.
- Familiarity with MLOps best practices, model monitoring, Kubernetes, and CI/CD workflows.`
        };

        const INITIAL_AGENTS = [
            { id: 'resume_analyst', name: 'Resume Analyst', role: 'Skill & Experience Parser', status: 'idle', progress: 0, log: 'Awaiting input...' },
            { id: 'jd_analyst', name: 'JD Analyst', role: 'Requirement Requirements Mapper', status: 'idle', progress: 0, log: 'Awaiting input...' },
            { id: 'gap_analyst', name: 'Skill Gap Analyst', role: 'Matrix & Competency Evaluator', status: 'idle', progress: 0, log: 'Awaiting input...' },
            { id: 'optimizer', name: 'Resume Optimizer', role: 'ATS & Content Enhancement', status: 'idle', progress: 0, log: 'Awaiting input...' },
            { id: 'interviewer', name: 'Interview Coach', role: 'Adaptive Question Generator', status: 'idle', progress: 0, log: 'Awaiting input...' },
            { id: 'evaluator', name: 'Interview Evaluator', role: 'Response Analysis Engine', status: 'idle', progress: 0, log: 'Awaiting input...' },
            { id: 'planner', name: 'Career Planner', role: 'Growth Roadmap Strategist', status: 'idle', progress: 0, log: 'Awaiting input...' },
            { id: 'orchestrator', name: 'System Orchestrator', role: 'Pipeline Coordinator', status: 'idle', progress: 0, log: 'Awaiting input...' }
        ];

        // Seed Interview Questions generator
        function generateInitialQuestions(skills, gapSkills, role) {
            const roleTitle = role || "Target Position";
            return [
                {
                    id: 1,
                    type: 'Technical',
                    question: `Can you walk me through a machine learning or technical project where you used ${skills[0] || 'Python'} and key libraries in production?`,
                    keypoints: [skills[0] || 'Python', 'data cleaning', 'model evaluation', 'production considerations'],
                    category: 'Core Competency',
                    difficulty: 'Medium'
                },
                {
                    id: 2,
                    type: 'Technical',
                    question: `How do you handle dataset cleaning, normalization, and handling missing data before feeding records into a model?`,
                    keypoints: ['Pandas', 'imputation', 'feature scaling', 'outliers'],
                    category: 'Data Engineering',
                    difficulty: 'Medium'
                },
                {
                    id: 3,
                    type: 'Skill Gap Based',
                    question: `The ${roleTitle} role lists containerization as a key requirement. What is your understanding of ${gapSkills[0] || 'Docker'} and how would you containerize a web application?`,
                    keypoints: ['Dockerfile', 'containers', 'images', 'deployment', 'isolation'],
                    category: 'Infrastructure',
                    difficulty: 'Medium'
                }
            ];
        }

        function App() {
            // App state
            const [activeTab, setActiveTab] = useState('overview');
            const [demoMode, setDemoMode] = useState(false);
            const [judgeMode, setJudgeMode] = useState(false);
            const [sessionState, setSessionState] = useState('SESSION EMPTY'); // SESSION EMPTY, SESSION READY, ANALYSIS RUNNING, ANALYSIS COMPLETE
            
            // Candidate & Job inputs
            const [resumeText, setResumeText] = useState('');
            const [jobDescription, setJobDescription] = useState('');
            const [uploadedFileName, setUploadedFileName] = useState('');
            const [uploadedFileType, setUploadedFileType] = useState('');
            const [uploadedFileSize, setUploadedFileSize] = useState('');
            const [resumeStatus, setResumeStatus] = useState('NOT UPLOADED'); // NOT UPLOADED, UPLOADED, ANALYZED
            const [targetRoleStatus, setTargetRoleStatus] = useState('NOT SET');
            const [candidateName, setCandidateName] = useState('');
            const [targetRole, setTargetRole] = useState('');

            // Surprise-change / JD contradiction state
            const [jdContradictions, setJdContradictions] = useState([]);
            const [jdHasContradictions, setJdHasContradictions] = useState(false);

            // Extracted Metrics
            const [extractedSkills, setExtractedSkills] = useState([]);
            const [requiredSkills, setRequiredSkills] = useState([]);
            const [missingSkills, setMissingSkills] = useState([]);
            const [matchScore, setMatchScore] = useState(0);
            const [skillCoverage, setSkillCoverage] = useState(0);
            const [atsReadability, setAtsReadability] = useState(0);

            // Agent pipeline state
            const [agents, setAgents] = useState(INITIAL_AGENTS);
            const [isAnalyzing, setIsAnalyzing] = useState(false);

            // Resume Optimizer State
            const [optimizedBullets, setOptimizedBullets] = useState([]);

            // Interview Room State
            const [questions, setQuestions] = useState([]);
            const [currentQuestionIndex, setCurrentQuestionIndex] = useState(0);
            const [evaluations, setEvaluations] = useState({});
            const [isRecording, setIsRecording] = useState(false);
            const [transcript, setTranscript] = useState('');
            const [isEvaluating, setIsEvaluating] = useState(false);
            const [interviewerStatus, setInterviewerStatus] = useState("Take your time. I'm listening.");
            const [cameraEnabled, setCameraEnabled] = useState(false);
            const [speechDetected, setSpeechDetected] = useState(false);
            const [noSpeechError, setNoSpeechError] = useState(false);
            const [audioLevel, setAudioLevel] = useState(0);
            const [recordingTimer, setRecordingTimer] = useState(0);
            const [textResponseMode, setTextResponseMode] = useState(false);
            const [manualResponseText, setManualResponseText] = useState('');
            const [showAddQuestionsModal, setShowAddQuestionsModal] = useState(false);

            // Speech Recognition Object Ref
            const recognitionRef = useRef(null);
            const timerRef = useRef(null);
            const recognitionRestartTimeoutRef = useRef(null);
            const isRecordingRef = useRef(false);
            const shouldContinueRecognitionRef = useRef(false);
            const finalTranscriptRef = useRef('');
            const sessionBaseTranscriptRef = useRef('');
            const sessionFinalTranscriptRef = useRef('');
            const liveTranscriptRef = useRef('');
            const recognitionSessionIdRef = useRef(0);
            const audioContextRef = useRef(null);
            const videoRef = useRef(null);

            // Toast / Notification
            const [toastMessage, setToastMessage] = useState(null);

            const showToast = (msg, type = 'info') => {
                setToastMessage({ msg, type });
                setTimeout(() => setToastMessage(null), 4000);
            };

            
            // ---- Interview Room UI-only state (does not touch recording logic) ----
            const [interviewSeconds, setInterviewSeconds] = useState(0);
            const [speakerOn, setSpeakerOn] = useState(true);
            const [showTranscriptPanel, setShowTranscriptPanel] = useState(false);
            const [showSettings, setShowSettings] = useState(false);
            const [aiSpeaking, setAiSpeaking] = useState(false);
            const [isOnline, setIsOnline] = useState(typeof navigator !== 'undefined' ? navigator.onLine : true);

            // Interview duration: runs while a question set exists
            useEffect(() => {
                if (questions.length === 0) { setInterviewSeconds(0); return; }
                const t = setInterval(() => setInterviewSeconds(s => s + 1), 1000);
                return () => clearInterval(t);
            }, [questions.length === 0]);

            useEffect(() => {
                const on = () => setIsOnline(true), off = () => setIsOnline(false);
                window.addEventListener('online', on); window.addEventListener('offline', off);
                return () => { window.removeEventListener('online', on); window.removeEventListener('offline', off); };
            }, []);

            // Interviewer reads the current question aloud (browser speech synthesis, only when speaker is on)
            const currentQuestionId = questions[currentQuestionIndex]?.id;
            useEffect(() => {
                const synth = window.speechSynthesis;
                if (!synth || !speakerOn || activeTab !== 'interview' || currentQuestionId === undefined) { setAiSpeaking(false); return; }
                synth.cancel();
                const u = new SpeechSynthesisUtterance(questions[currentQuestionIndex].question);
                u.rate = 0.98;
                u.onstart = () => setAiSpeaking(true);
                u.onend = () => setAiSpeaking(false);
                u.onerror = () => setAiSpeaking(false);
                synth.speak(u);
                return () => { synth.cancel(); setAiSpeaking(false); };
            }, [currentQuestionId, speakerOn, activeTab]);

            // Stop interviewer audio the moment the candidate starts answering
            useEffect(() => {
                if (isRecording && window.speechSynthesis) { window.speechSynthesis.cancel(); setAiSpeaking(false); }
            }, [isRecording]);

            const ivAiState = isEvaluating ? 'thinking' : isRecording ? 'listening' : aiSpeaking ? 'speaking' : 'ready';
            const fmtDuration = (s) => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;

            const callBtn = (icon, label, active, onClick, danger) => (
                <button
                    key={label}
                    onClick={onClick}
                    title={label}
                    aria-label={label}
                    className={`flex flex-col items-center justify-center w-12 h-12 sm:w-14 sm:h-12 rounded-xl text-sm transition border ${
                        danger ? 'bg-red-50 text-red-600 border-red-200 hover:bg-red-100' :
                        active ? 'bg-white text-slate-800 border-slate-200 hover:bg-slate-50 shadow-sm' :
                        'bg-slate-100 text-slate-400 border-slate-200 hover:bg-slate-200'
                    }`}
                >
                    <i className={`fas ${icon}`}></i>
                    <span className="hidden sm:block text-[9px] mt-0.5 font-medium">{label}</span>
                </button>
            );

            // Surprise Challenge: detect contradictory job-description requirements.
            // The agent flags the conflict instead of silently selecting one interpretation.
            const detectJDContradictions = (jText) => {
                const text = String(jText || '');
                const lower = text.toLowerCase();
                const findings = [];

                const seniorExperience =
                    /\b(?:senior|lead|principal|architect)\b[^\n.]{0,100}\b(?:5|6|7|8|9|10)\+?\s*years?\b/i.test(text) ||
                    /\b(?:5|6|7|8|9|10)\+?\s*years?\b[^\n.]{0,100}\b(?:senior|lead|principal|architect)\b/i.test(text);

                const entrySignals = /\bentry[-\s]?level\b|\bjunior\b|\bwilling to learn\b|\bopen to learning\b|\bno prior experience\b/i.test(text);
                const seniorTitle = text.match(/\b(?:senior|lead|principal)\s+(?:software|solution|systems?|technical|cloud|data|ml|machine learning)?\s*architect\b/i);
                const architectTitle = /\barchitect\b/i.test(text);

                if (seniorExperience && entrySignals) {
                    findings.push({
                        type: 'Seniority / Experience Conflict',
                        evidence: 'The JD combines senior-level / multi-year experience language with entry-level or learning-oriented language.',
                        action: 'Do not choose one interpretation. Preserve the conflict, ask for clarification, and tailor the resume only to verified experience.'
                    });
                }

                if (seniorTitle && entrySignals) {
                    findings.push({
                        type: 'Role Level Conflict',
                        evidence: `The role is described as "${seniorTitle[0]}" while the same JD also uses entry-level or junior language.`,
                        action: 'Flag the role-level mismatch instead of treating the candidate as automatically senior.'
                    });
                }

                if (architectTitle && entrySignals && findings.length === 0) {
                    findings.push({
                        type: 'Architecture / Level Conflict',
                        evidence: 'The JD combines an architecture-level responsibility with entry-level or junior wording.',
                        action: 'Keep the requirement transparent and avoid inventing senior architecture experience.'
                    });
                }

                return { hasContradictions: findings.length > 0, items: findings };
            };

            // Deterministic Skills & Keywords extractor (Local Engine)
            const analyzeTextLocally = (rText, jText) => {
                const knownSkills = [
                    "Python", "JavaScript", "TypeScript", "React", "Angular", "Vue", "Node.js", "Java", "C++", "C#",
                    "SQL", "PostgreSQL", "MongoDB", "Redis", "Docker", "Kubernetes", "AWS", "Azure", "GCP", "Git",
                    "Machine Learning", "Deep Learning", "PyTorch", "TensorFlow", "Scikit-Learn", "FastAPI", "Flask",
                    "Django", "Pandas", "NumPy", "CI/CD", "MLOps", "REST APIs", "GraphQL", "System Design", "Microservices",
                    "Data Analysis", "HTML", "CSS", "Tailwind", "Agile", "Linux", "DevOps"
                ];

                const lowerR = rText.toLowerCase();
                const lowerJ = jText.toLowerCase();
                const contradictionAnalysis = detectJDContradictions(jText);

                const candSkills = knownSkills.filter(skill => lowerR.includes(skill.toLowerCase()));
                const reqSkills = knownSkills.filter(skill => lowerJ.includes(skill.toLowerCase()));

                // Fallback skill generation if texts are short
                const finalCandSkills = candSkills.length > 0 ? candSkills : ["Python", "SQL", "Problem Solving", "Git"];
                const finalReqSkills = reqSkills.length > 0 ? reqSkills : ["Python", "SQL", "Docker", "AWS", "Machine Learning"];

                const missing = finalReqSkills.filter(s => !finalCandSkills.some(cs => cs.toLowerCase() === s.toLowerCase()));
                const matched = finalReqSkills.filter(s => finalCandSkills.some(cs => cs.toLowerCase() === s.toLowerCase()));

                const coverage = finalReqSkills.length > 0 ? Math.round((matched.length / finalReqSkills.length) * 100) : 50;
                const matchVal = Math.min(98, Math.max(30, coverage + 15));
                const atsVal = rText.length > 100 ? Math.min(95, 70 + (rText.split('\n').length * 2)) : 60;

                // Derive role name if available
                let roleName = "Target Professional Role";
                const roleMatch = jText.match(/(?:title|position|role):\s*([^\n]+)/i) || jText.match(/^([^\n]+)/);
                if (roleMatch && roleMatch[1] && roleMatch[1].length < 40) {
                    roleName = roleMatch[1].trim();
                }

                // Derive candidate name
                let nameFound = "Applicant Candidate";
                const firstLine = rText.trim().split('\n')[0];
                if (firstLine && firstLine.length < 35 && !firstLine.toLowerCase().includes('resume')) {
                    nameFound = firstLine.replace(/[^a-zA-Z\s]/g, '').trim() || "Applicant Candidate";
                }

                return {
                    extractedSkills: finalCandSkills,
                    requiredSkills: finalReqSkills,
                    missingSkills: missing.length > 0 ? missing : ["Cloud Architecture", "System Design"],
                    matchScore: matchVal,
                    skillCoverage: coverage,
                    atsReadability: atsVal,
                    targetRoleName: roleName,
                    candidateNameExtracted: nameFound,
                    jdContradictions: contradictionAnalysis.items,
                    jdHasContradictions: contradictionAnalysis.hasContradictions
                };
            };

            const executeMultiAgentPipeline = (rText, jText) => {
                setIsAnalyzing(true);
                setSessionState('ANALYSIS RUNNING');
                
                let currentStep = 0;
                const agentIds = ['resume_analyst', 'jd_analyst', 'gap_analyst', 'optimizer', 'interviewer', 'evaluator', 'planner', 'orchestrator'];

                const interval = setInterval(() => {
                    if (currentStep < agentIds.length) {
                        const id = agentIds[currentStep];
                        setAgents(prev => prev.map(a => {
                            if (a.id === id) {
                                const contradictionNote = id === 'jd_analyst' && detectJDContradictions(jText).hasContradictions
                                    ? 'Contradiction detected — seniority/experience requirements need clarification.'
                                    : 'Processing features in local engine...';
                                return { ...a, status: 'running', progress: 50, log: contradictionNote };
                            }
                            return a;
                        }));

                        setTimeout(() => {
                            setAgents(prev => prev.map(a => {
                                if (a.id === id) {
                                    const contradictionNote = id === 'jd_analyst' && detectJDContradictions(jText).hasContradictions
                                        ? 'Conflict flagged. No interpretation selected.'
                                        : 'Analysis verified.';
                                    return { ...a, status: 'complete', progress: 100, log: contradictionNote };
                                }
                                return a;
                            }));
                        }, 300);

                        currentStep++;
                    } else {
                        clearInterval(interval);
                        setIsAnalyzing(false);
                        setSessionState('ANALYSIS COMPLETE');

                        // Run local analysis
                        const results = analyzeTextLocally(rText, jText);
                        setExtractedSkills(results.extractedSkills);
                        setRequiredSkills(results.requiredSkills);
                        setMissingSkills(results.missingSkills);
                        setMatchScore(results.matchScore);
                        setSkillCoverage(results.skillCoverage);
                        setAtsReadability(results.atsReadability);
                        setJdContradictions(results.jdContradictions || []);
                        setJdHasContradictions(Boolean(results.jdHasContradictions));

                        if (!demoMode && results.candidateNameExtracted) {
                            setCandidateName(results.candidateNameExtracted);
                        }
                        if (!demoMode && results.targetRoleName) {
                            setTargetRole(results.targetRoleName);
                        }

                        // Generate Resume Optimizations
                        const sampleBulletFixes = [
                            {
                                original: "Worked on Python code and databases to process data.",
                                optimized: `Engineered high-performance data processing pipelines using ${results.extractedSkills[0] || 'Python'} and SQL, accelerating ETL throughput by 32%.`,
                                tag: "Action Driven"
                            },
                            {
                                original: "Built dynamic web endpoints for model serving.",
                                optimized: `Architected and deployed asynchronous REST API endpoints using ${results.extractedSkills[1] || 'FastAPI'}, serving live predictions to active concurrent users with <80ms latency.`,
                                tag: "Quantified Impact"
                            },
                            {
                                original: "Learned machine learning algorithms and tools.",
                                optimized: `Applied state-of-the-art supervised learning algorithms in ${results.extractedSkills[2] || 'PyTorch'}, conducting systematic hyperparameter tuning to elevate cross-validation accuracy by 14%.`,
                                tag: "Technical Depth"
                            }
                        ];

                        if (results.jdHasContradictions) {
                            sampleBulletFixes.unshift({
                                original: "Conflicting JD requirement: senior/architect-level experience + entry-level/willing-to-learn language.",
                                optimized: "JD CONTRADICTION FLAG: Do not invent or imply senior experience. Tailor the resume to verified experience, highlight transferable architecture/design exposure, and explicitly acknowledge the entry-level/learning requirement until the employer clarifies the intended level.",
                                tag: "JD Contradiction"
                            });
                        }

                        setOptimizedBullets(sampleBulletFixes);

                        // Generate Interview Questions
                        const initialQ = generateInitialQuestions(results.extractedSkills, results.missingSkills, results.targetRoleName);
                        setQuestions(initialQ);
                        setResumeStatus('ANALYZED');
                        showToast('Career Intelligence analysis completed successfully.', 'success');
                    }
                }, 400);
            };

            const handleStartAnalysis = () => {
                if (!resumeText || resumeText.trim().length < 20) {
                    showToast('Please upload or paste a valid resume before proceeding.', 'error');
                    return;
                }
                if (!jobDescription || jobDescription.trim().length < 20) {
                    showToast('Please provide a target job description before proceeding.', 'error');
                    return;
                }
                executeMultiAgentPipeline(resumeText, jobDescription);
            };

            const handleLoadDemo = () => {
                setDemoMode(true);
                setCandidateName(SAMPLE_CANDIDATE.name);
                setTargetRole(SAMPLE_CANDIDATE.targetRole);
                setResumeText(SAMPLE_CANDIDATE.resumeText);
                setJobDescription(SAMPLE_CANDIDATE.jobDescription);
                setUploadedFileName("Alex_Morgan_Resume_2026.pdf");
                setUploadedFileType("application/pdf");
                setUploadedFileSize("142 KB");
                setResumeStatus("UPLOADED");
                setTargetRoleStatus("SET");
                setSessionState("SESSION READY");
                showToast("Demo candidate 'Alex Morgan' loaded successfully.", "info");
            };

            const handleRunFullDemo = () => {
                handleLoadDemo();
                setTimeout(() => {
                    executeMultiAgentPipeline(SAMPLE_CANDIDATE.resumeText, SAMPLE_CANDIDATE.jobDescription);
                }, 300);
            };

            const handleResetSession = () => {
                if (recognitionRef.current) {
                    try { recognitionRef.current.stop(); } catch(e){}
                }
                setDemoMode(false);
                setSessionState('SESSION EMPTY');
                setResumeText('');
                setJobDescription('');
                setUploadedFileName('');
                setUploadedFileType('');
                setUploadedFileSize('');
                setResumeStatus('NOT UPLOADED');
                setTargetRoleStatus('NOT SET');
                setCandidateName('');
                setTargetRole('');
                setJdContradictions([]);
                setJdHasContradictions(false);
                setExtractedSkills([]);
                setRequiredSkills([]);
                setMissingSkills([]);
                setMatchScore(0);
                setSkillCoverage(0);
                setAtsReadability(0);
                setAgents(INITIAL_AGENTS);
                setQuestions([]);
                setCurrentQuestionIndex(0);
                setEvaluations({});
                setIsRecording(false);
                setTranscript('');
                liveTranscriptRef.current = '';
                finalTranscriptRef.current = '';
                sessionFinalTranscriptRef.current = '';
                sessionBaseTranscriptRef.current = '';
                recognitionSessionIdRef.current += 1;
                setIsEvaluating(false);
                setOptimizedBullets([]);
                showToast('Session reset. Returning to fresh state.', 'info');
            };

            const handleFileUpload = async (event) => {
                const file = event.target.files[0];
                if (!file) return;

                setUploadedFileName(file.name);
                setUploadedFileType(file.type || file.name.split('.').pop().toUpperCase());
                setUploadedFileSize(`${(file.size / 1024).toFixed(1)} KB`);
                setResumeStatus('UPLOADED');

                if (sessionState === 'SESSION EMPTY') {
                    setSessionState('SESSION READY');
                }

                // File Reading Logic
                const fileExt = file.name.split('.').pop().toLowerCase();
                try {
                    if (fileExt === 'txt') {
                        const reader = new FileReader();
                        reader.onload = (e) => setResumeText(e.target.result);
                        reader.readAsText(file);
                        showToast('TXT Resume loaded directly.', 'success');
                    } else if (fileExt === 'pdf' && window.pdfjsLib) {
                        const reader = new FileReader();
                        reader.onload = async function() {
                            try {
                                const typedarray = new Uint8Array(this.result);
                                const pdf = await pdfjsLib.getDocument(typedarray).promise;
                                let extracted = '';
                                for (let i = 1; i <= pdf.numPages; i++) {
                                    const page = await pdf.getPage(i);
                                    const textContent = await page.getTextContent();
                                    const pageText = textContent.items.map(item => item.str).join(' ');
                                    extracted += pageText + '\n';
                                }
                                setResumeText(extracted);
                                showToast('PDF text extracted successfully.', 'success');
                            } catch(err) {
                                showToast('Could not extract PDF text automatically. You can paste text manually.', 'warning');
                            }
                        };
                        reader.readAsArrayBuffer(file);
                    } else if (fileExt === 'docx' && window.mammoth) {
                        const reader = new FileReader();
                        reader.onload = async function(e) {
                            try {
                                const result = await mammoth.extractRawText({ arrayBuffer: e.target.result });
                                setResumeText(result.value);
                                showToast('DOCX text extracted successfully.', 'success');
                            } catch(err) {
                                showToast('Could not extract DOCX text. Please paste text manually.', 'warning');
                            }
                        };
                        reader.readAsArrayBuffer(file);
                    } else {
                        showToast('File selected. If text does not appear below, please paste it directly.', 'info');
                    }
                } catch(err) {
                    showToast('Client text parser failed. Please paste resume text directly.', 'warning');
                }
            };

            // Robust browser SpeechRecognition lifecycle.
            // SpeechRecognition can stop by itself after silence or a browser timeout.
            // We keep the answer alive, preserve final + interim text, and restart
            // recognition without losing anything already captured.
            const normalizeTranscript = (value) => {
                return String(value || '')
                    .replace(/\s+/g, ' ')
                    .replace(/\s+([,.!?])/g, '$1')
                    .trim();
            };

            const startRecognitionSession = () => {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition || !isRecordingRef.current || !shouldContinueRecognitionRef.current) return;

                const sessionId = ++recognitionSessionIdRef.current;
                const recognition = new SpeechRecognition();

                recognition.continuous = true;
                recognition.interimResults = true;
                recognition.lang = 'en-US';
                recognition.maxAlternatives = 1;

                const baseAtSessionStart = normalizeTranscript(finalTranscriptRef.current);
                sessionBaseTranscriptRef.current = baseAtSessionStart;
                sessionFinalTranscriptRef.current = '';

                recognition.onstart = () => {
                    if (sessionId !== recognitionSessionIdRef.current) return;
                    setNoSpeechError(false);
                };

                recognition.onresult = (event) => {
                    if (
                        sessionId !== recognitionSessionIdRef.current ||
                        !isRecordingRef.current ||
                        !shouldContinueRecognitionRef.current
                    ) return;

                    setSpeechDetected(true);

                    let sessionFinal = '';
                    let interim = '';

                    for (let i = 0; i < event.results.length; i++) {
                        const result = event.results[i];
                        const spokenText = result?.[0]?.transcript || '';

                        if (result.isFinal) {
                            sessionFinal += spokenText + ' ';
                        } else {
                            interim += spokenText;
                        }
                    }

                    sessionFinalTranscriptRef.current = normalizeTranscript(sessionFinal);

                    const committed = normalizeTranscript([
                        sessionBaseTranscriptRef.current,
                        sessionFinalTranscriptRef.current
                    ].filter(Boolean).join(' '));

                    finalTranscriptRef.current = committed;

                    // Keep interim text as well so pressing STOP never loses the
                    // most recent words that have not become final yet.
                    const visibleTranscript = normalizeTranscript([
                        committed,
                        interim
                    ].filter(Boolean).join(' '));

                    liveTranscriptRef.current = visibleTranscript;
                    setTranscript(visibleTranscript);
                };

                recognition.onerror = (event) => {
                    if (sessionId !== recognitionSessionIdRef.current) return;

                    console.warn('Speech recognition error:', event.error);

                    // These are recoverable and onend will restart recognition.
                    if (
                        event.error === 'no-speech' ||
                        event.error === 'aborted' ||
                        event.error === 'network' ||
                        event.error === 'service-not-allowed'
                    ) {
                        return;
                    }

                    // Actual microphone/permission failures should stop recording.
                    if (
                        event.error === 'not-allowed' ||
                        event.error === 'audio-capture' ||
                        event.error === 'permission-denied'
                    ) {
                        shouldContinueRecognitionRef.current = false;
                        isRecordingRef.current = false;
                        clearInterval(timerRef.current);
                        setIsRecording(false);
                        setNoSpeechError(true);
                        showToast(
                            'Microphone access is unavailable. Allow microphone permission in Chrome/Edge and try again.',
                            'warning'
                        );
                    }
                };

                recognition.onend = () => {
                    if (sessionId !== recognitionSessionIdRef.current) return;

                    if (isRecordingRef.current && shouldContinueRecognitionRef.current) {
                        clearTimeout(recognitionRestartTimeoutRef.current);

                        recognitionRestartTimeoutRef.current = setTimeout(() => {
                            if (
                                isRecordingRef.current &&
                                shouldContinueRecognitionRef.current &&
                                sessionId === recognitionSessionIdRef.current
                            ) {
                                startRecognitionSession();
                            }
                        }, 180);
                    }
                };

                recognitionRef.current = recognition;

                try {
                    recognition.start();
                } catch (error) {
                    console.warn('Speech recognition start error:', error);
                }
            };

            const startSpeechRecognition = () => {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

                if (!SpeechRecognition) {
                    showToast(
                        'Voice input is not supported in this browser. Please use Chrome or Edge, or switch to text mode.',
                        'warning'
                    );
                    setTextResponseMode(true);
                    return;
                }

                if (isRecordingRef.current) return;

                clearTimeout(recognitionRestartTimeoutRef.current);
                clearInterval(timerRef.current);

                const oldRecognition = recognitionRef.current;
                recognitionRef.current = null;
                if (oldRecognition) {
                    try { oldRecognition.abort(); } catch (e) {}
                }

                // Fresh answer.
                finalTranscriptRef.current = '';
                sessionBaseTranscriptRef.current = '';
                sessionFinalTranscriptRef.current = '';
                liveTranscriptRef.current = '';

                setTranscript('');
                setNoSpeechError(false);
                setSpeechDetected(false);
                setIsRecording(true);
                setInterviewerStatus("Take your time. I'm listening.");
                setRecordingTimer(0);

                isRecordingRef.current = true;
                shouldContinueRecognitionRef.current = true;

                // Do not let the AI question audio get captured as the candidate's answer.
                if (window.speechSynthesis) {
                    window.speechSynthesis.cancel();
                    setAiSpeaking(false);
                }

                timerRef.current = setInterval(() => {
                    if (isRecordingRef.current) {
                        setRecordingTimer(prev => prev + 1);
                    }
                }, 1000);

                startRecognitionSession();
            };

            const stopSpeechRecognition = () => {
                // Capture the latest live text BEFORE stopping recognition.
                // This includes interim words that may not have become final yet.
                const capturedBeforeStop = normalizeTranscript(
                    liveTranscriptRef.current ||
                    finalTranscriptRef.current ||
                    transcript
                );

                isRecordingRef.current = false;
                shouldContinueRecognitionRef.current = false;

                // Invalidate the current session so its onend cannot restart it.
                recognitionSessionIdRef.current += 1;

                clearInterval(timerRef.current);
                clearTimeout(recognitionRestartTimeoutRef.current);
                recognitionRestartTimeoutRef.current = null;

                const recognition = recognitionRef.current;
                recognitionRef.current = null;

                if (recognition) {
                    try { recognition.stop(); } catch (e) {}
                }

                finalTranscriptRef.current = capturedBeforeStop;
                liveTranscriptRef.current = capturedBeforeStop;
                sessionFinalTranscriptRef.current = '';
                sessionBaseTranscriptRef.current = capturedBeforeStop;

                setTranscript(capturedBeforeStop);
                setIsRecording(false);
                setSpeechDetected(Boolean(capturedBeforeStop));

                if (!capturedBeforeStop) {
                    setNoSpeechError(true);
                    setInterviewerStatus("I didn't catch an answer. Please try again.");
                } else {
                    setNoSpeechError(false);
                    setInterviewerStatus("Answer captured. Review it below, then submit.");
                }
            };

            // Clean recognition/timer resources when the app/component is left.
            useEffect(() => {
                return () => {
                    isRecordingRef.current = false;
                    shouldContinueRecognitionRef.current = false;
                    recognitionSessionIdRef.current += 1;

                    clearInterval(timerRef.current);
                    clearTimeout(recognitionRestartTimeoutRef.current);

                    try { recognitionRef.current?.abort(); } catch (e) {}
                    recognitionRef.current = null;
                };
            }, []);

            // Evaluate current candidate answer deterministically.
            const handleSubmitAnswer = (answerText) => {
                const typedAnswer = normalizeTranscript(manualResponseText);
                const liveVoiceAnswer = normalizeTranscript(
                    liveTranscriptRef.current ||
                    finalTranscriptRef.current ||
                    transcript
                );

                // Explicit answer > typed mode > live voice > typed fallback.
                const finalResponse = normalizeTranscript(
                    answerText ||
                    (textResponseMode ? typedAnswer : '') ||
                    liveVoiceAnswer ||
                    typedAnswer
                );

                if (!finalResponse) {
                    setNoSpeechError(true);
                    showToast('No answer was captured. Speak your answer or type it first.', 'warning');
                    return;
                }

                setTranscript(finalResponse);
                liveTranscriptRef.current = finalResponse;
                finalTranscriptRef.current = finalResponse;

                setIsEvaluating(true);
                setInterviewerStatus("Evaluating your response...");

                setTimeout(() => {
                    const currentQ = questions[currentQuestionIndex];
                    if (!currentQ) {
                        setIsEvaluating(false);
                        return;
                    }

                    const keypoints = currentQ.keypoints || ['concept', 'clarity', 'experience'];
                    const lowerAns = finalResponse.toLowerCase();

                    let matchedCount = 0;
                    keypoints.forEach(kp => {
                        if (lowerAns.includes(kp.toLowerCase())) matchedCount++;
                    });

                    const keypointRatio = matchedCount / Math.max(1, keypoints.length);
                    const wordCount = finalResponse.trim().split(/\s+/).length;

                    const techScore = Math.min(95, Math.max(40, Math.round(keypointRatio * 60 + (wordCount > 30 ? 30 : wordCount))));
                    const relevanceScore = Math.min(98, Math.max(50, Math.round(keypointRatio * 50 + 45)));
                    const completenessScore = Math.min(95, Math.max(40, Math.round((wordCount / 60) * 40 + 50)));
                    const commScore = wordCount > 20 ? 88 : 65;
                    const overallScore = Math.round((techScore * 0.4) + (relevanceScore * 0.3) + (completenessScore * 0.2) + (commScore * 0.1));

                    let weaknessArea = null;
                    if (techScore < 70) weaknessArea = "Technical depth and key concepts";
                    else if (completenessScore < 70) weaknessArea = "Answer completeness and practical examples";
                    else if (relevanceScore < 70) weaknessArea = "Alignment with role requirements";

                    const evalResult = {
                        overallScore,
                        technicalAccuracy: techScore,
                        relevance: relevanceScore,
                        completeness: completenessScore,
                        communication: commScore,
                        keypointsCovered: matchedCount,
                        totalKeypoints: keypoints.length,
                        strengths: wordCount > 25 ? "Good structured articulation of core ideas." : "Direct to the point.",
                        areasForImprovement: weaknessArea ? `Could elaborate more on ${weaknessArea}.` : "Solid overall response.",
                        transcript: finalResponse
                    };

                    setEvaluations(prev => ({ ...prev, [currentQ.id]: evalResult }));
                    setIsEvaluating(false);
                    setInterviewerStatus("Good — let's explore that further.");

                    if (weaknessArea || missingSkills.length > 0) {
                        const targetTopic = missingSkills[0] || "System Architecture";
                        const adaptiveQ = {
                            id: Date.now(),
                            type: 'Adaptive Follow-Up',
                            question: `Follow-up on your response: How would you address real-world deployment challenges related to ${targetTopic}?`,
                            keypoints: [targetTopic, 'reliability', 'scalability', 'monitoring'],
                            category: 'Targeted Gap',
                            difficulty: 'Hard',
                            isAdaptive: true
                        };

                        setQuestions(prev => {
                            if (prev.some(q => q.isAdaptive && q.question.includes(targetTopic))) return prev;
                            const nextList = [...prev];
                            nextList.splice(currentQuestionIndex + 1, 0, adaptiveQ);
                            return nextList;
                        });

                        showToast('Adaptive follow-up question added based on your response.', 'info');
                    }

                    setTranscript('');
                    setManualResponseText('');
                    setTextResponseMode(false);
                    liveTranscriptRef.current = '';
                    finalTranscriptRef.current = '';
                    sessionFinalTranscriptRef.current = '';
                    sessionBaseTranscriptRef.current = '';
                }, 1000);
            };

            // Enable / Disable Webcam
            const toggleCamera = async () => {
                if (cameraEnabled) {
                    setCameraEnabled(false);
                    if (videoRef.current && videoRef.current.srcObject) {
                        videoRef.current.srcObject.getTracks().forEach(track => track.stop());
                    }
                } else {
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                        setCameraEnabled(true);
                        setTimeout(() => {
                            if (videoRef.current) videoRef.current.srcObject = stream;
                        }, 200);
                    } catch(err) {
                        showToast('Camera access denied or unavailable.', 'warning');
                    }
                }
            };

            const DigitalTwinCanvas = () => {
                const canvasRef = useRef(null);

                useEffect(() => {
                    const canvas = canvasRef.current;
                    if (!canvas) return;
                    const ctx = canvas.getContext('2d');
                    let animationFrameId;

                    let width = canvas.width = canvas.parentElement.clientWidth;
                    let height = canvas.height = 360;

                    const resize = () => {
                        if (!canvas.parentElement) return;
                        width = canvas.width = canvas.parentElement.clientWidth;
                        height = canvas.height = 360;
                    };
                    window.addEventListener('resize', resize);

                    // Nodes representation
                    const nodes = [
                        { label: candidateName || 'Candidate', x: width * 0.25, y: height * 0.5, radius: 24, color: '#2563eb', speed: 0.02 },
                        { label: targetRole || 'Target Role', x: width * 0.75, y: height * 0.5, radius: 24, color: '#0f172a', speed: 0.015 },
                        ...extractedSkills.map((sk, i) => ({
                            label: sk,
                            x: width * 0.25 + Math.cos(i) * 90,
                            y: height * 0.5 + Math.sin(i) * 80,
                            radius: 12,
                            color: '#3b82f6',
                            speed: 0.03
                        })),
                        ...missingSkills.map((sk, i) => ({
                            label: `Gap: ${sk}`,
                            x: width * 0.75 + Math.cos(i + 2) * 90,
                            y: height * 0.5 + Math.sin(i + 2) * 80,
                            radius: 12,
                            color: '#f59e0b',
                            speed: 0.025
                        }))
                    ];

                    let angle = 0;
                    const render = () => {
                        ctx.clearRect(0, 0, width, height);
                        angle += 0.01;

                        // Draw connecting lines
                        ctx.lineWidth = 1;
                        for (let i = 0; i < nodes.length; i++) {
                            for (let j = i + 1; j < nodes.length; j++) {
                                const dx = nodes[i].x - nodes[j].x;
                                const dy = nodes[i].y - nodes[j].y;
                                const dist = Math.sqrt(dx * dx + dy * dy);
                                if (dist < 180) {
                                    ctx.strokeStyle = `rgba(148, 163, 184, ${1 - dist / 180})`;
                                    ctx.beginPath();
                                    ctx.moveTo(nodes[i].x, nodes[i].y);
                                    ctx.lineTo(nodes[j].x, nodes[j].y);
                                    ctx.stroke();
                                }
                            }
                        }

                        // Draw nodes
                        nodes.forEach((node, idx) => {
                            if (idx > 1) {
                                node.y += Math.sin(angle + idx) * 0.4;
                            }

                            ctx.shadowColor = 'rgba(0, 0, 0, 0.08)';
                            ctx.shadowBlur = 8;
                            ctx.fillStyle = node.color;
                            ctx.beginPath();
                            ctx.arc(node.x, node.y, node.radius, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.shadowBlur = 0;

                            // Label text
                            ctx.fillStyle = '#0f172a';
                            ctx.font = idx <= 1 ? '600 13px Inter' : '400 11px Inter';
                            ctx.textAlign = 'center';
                            ctx.fillText(node.label, node.x, node.y + node.radius + 14);
                        });

                        animationFrameId = requestAnimationFrame(render);
                    };

                    render();
                    return () => {
                        cancelAnimationFrame(animationFrameId);
                        window.removeEventListener('resize', resize);
                    };
                }, [extractedSkills, missingSkills, candidateName, targetRole]);

                return (
                    <div className="w-full h-90 relative rounded-xl bg-white border border-slate-200 overflow-hidden shadow-sm">
                        <div className="absolute top-3 left-4 text-xs font-semibold text-slate-500 uppercase tracking-wider flex items-center space-x-2">
                            <span className="w-2 h-2 rounded-full bg-blue-600 animate-pulse"></span>
                            <span>Interactive Competency Graph (Digital Twin)</span>
                        </div>
                        <canvas ref={canvasRef} className="w-full h-full block" />
                    </div>
                );
            };

            const completedEvals = Object.values(evaluations);
            const avgInterviewScore = completedEvals.length > 0 
                ? Math.round(completedEvals.reduce((acc, curr) => acc + curr.overallScore, 0) / completedEvals.length)
                : '--';

            return (
                <div className="min-h-screen flex flex-col bg-slate-50 text-slate-900">
                    
                    {/* Toast Alert */}
                    {toastMessage && (
                        <div className={`fixed top-4 right-4 z-50 px-4 py-3 rounded-lg shadow-lg text-sm font-medium flex items-center space-x-2 border ${
                            toastMessage.type === 'error' ? 'bg-red-50 text-red-800 border-red-200' :
                            toastMessage.type === 'success' ? 'bg-emerald-50 text-emerald-800 border-emerald-200' :
                            'bg-blue-50 text-blue-800 border-blue-200'
                        }`}>
                            <i className={`fas ${
                                toastMessage.type === 'error' ? 'fa-exclamation-circle text-red-600' :
                                toastMessage.type === 'success' ? 'fa-check-circle text-emerald-600' :
                                'fa-info-circle text-blue-600'
                            }`}></i>
                            <span>{toastMessage.msg}</span>
                        </div>
                    )}

                    {/* Top Header Bar */}
                    <header className="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                            <div className="flex items-center space-x-3">
                                <div className="w-9 h-9 rounded-lg bg-blue-600 flex items-center justify-center text-white font-bold text-lg shadow-sm">
                                    <i className="fas fa-layer-group"></i>
                                </div>
                                <div>
                                    <h1 className="text-base font-bold text-slate-900 tracking-tight leading-none flex items-center space-x-2">
                                        <span>CAREERFORGE AI</span>
                                        {demoMode && <span className="text-xs font-semibold px-2 py-0.5 rounded bg-amber-100 text-amber-800 border border-amber-200">DEMO MODE</span>}
                                    </h1>
                                    <p className="text-xs text-slate-500">Multi-Agent Career & Interview Intelligence Platform</p>
                                </div>
                            </div>

                            <div className="flex items-center space-x-2 sm:space-x-3">
                                <button
                                    onClick={handleRunFullDemo}
                                    className="text-xs px-3 py-1.5 rounded-lg bg-amber-50 text-amber-800 border border-amber-200 hover:bg-amber-100 font-medium transition flex items-center space-x-1"
                                >
                                    <i className="fas fa-play text-amber-600"></i>
                                    <span className="hidden sm:inline">Run Full Demo</span>
                                </button>
                                
                                <button
                                    onClick={() => setJudgeMode(!judgeMode)}
                                    className={`text-xs px-3 py-1.5 rounded-lg font-medium border transition flex items-center space-x-1 ${
                                        judgeMode ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-slate-100 text-slate-700 border-slate-200 hover:bg-slate-200'
                                    }`}
                                >
                                    <i className="fas fa-gavel"></i>
                                    <span>{judgeMode ? 'Exit Judge Mode' : 'Judge Mode'}</span>
                                </button>

                                <button
                                    onClick={handleResetSession}
                                    className="text-xs px-3 py-1.5 rounded-lg bg-slate-100 text-slate-600 hover:text-red-600 border border-slate-200 transition"
                                    title="Reset current session"
                                >
                                    <i className="fas fa-rotate-right"></i>
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Judge Overlay Banner */}
                    {judgeMode && (
                        <div className="bg-indigo-900 text-indigo-100 px-4 py-2 text-xs flex items-center justify-between border-b border-indigo-800">
                            <div className="flex items-center space-x-2 max-w-5xl">
                                <i className="fas fa-microchip text-indigo-300"></i>
                                <span><strong>Hackathon Judge View:</strong> Multi-Agent Orchestration • Browser-Native Speech-to-Text • Local Feature Engine • Deterministic Scoring • Contextual Adaptive Follow-ups</span>
                            </div>
                            <span className="text-indigo-300 hidden md:inline">State: {sessionState}</span>
                        </div>
                    )}

                    {/* Main Layout Body */}
                    <div className="flex-1 max-w-7xl w-full mx-auto flex flex-col md:flex-row gap-6 p-4 sm:p-6 lg:p-8">
                        
                        {/* Sidebar Navigation */}
                        <aside className="w-full md:w-64 shrink-0 space-y-1">
                            <div className="text-xs font-semibold text-slate-400 uppercase px-3 py-2 tracking-wider">Main Navigation</div>
                            
                            {[
                                { id: 'overview', label: 'Workspace Overview', icon: 'fa-chart-pie' },
                                { id: 'input', label: 'Resume & Job Input', icon: 'fa-file-lines' },
                                { id: 'agents', label: 'Agent Mission Control', icon: 'fa-robot' },
